<!doctype html><meta charset="utf-8"><title>ffmpeg.wasm bench</title>
<pre id="log">idle</pre>
<script type="module">
import { FFmpeg } from "/node_modules/@ffmpeg/ffmpeg/dist/esm/index.js";
const log = (m) => { document.getElementById("log").textContent += "\n" + m; console.log(m); };
window.runBench = async () => {
  const r = {};
  const t0 = performance.now();
  const ff = new FFmpeg();
  let lastProg = 0;
  ff.on("progress", ({ progress }) => { lastProg = progress; });
  ff.on("log", ({ message }) => { if (/error|Invalid/i.test(message)) log(message); });
  await ff.load({
    coreURL: "/node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.js",
    wasmURL: "/node_modules/@ffmpeg/core/dist/esm/ffmpeg-core.wasm",
  });
  r.loadMs = Math.round(performance.now() - t0);
  const t1 = performance.now();
  const buf = new Uint8Array(await (await fetch("/test-lecture.mp4")).arrayBuffer());
  r.fetchMs = Math.round(performance.now() - t1);
  r.inputMB = +(buf.length / 1048576).toFixed(1);
  const t2 = performance.now();
  await ff.writeFile("in.mp4", buf);
  r.writeMs = Math.round(performance.now() - t2);
  window.__phase = "encoding";
  const t3 = performance.now();
  const code = await ff.exec(["-i", "in.mp4", "-vn", "-c:a", "libmp3lame", "-q:a", "4", "out.mp3"]);
  r.encodeMs = Math.round(performance.now() - t3);
  r.exitCode = code;
  const out = await ff.readFile("out.mp3");
  r.outputMB = +(out.length / 1048576).toFixed(1);
  r.jsHeapMB = performance.memory ? Math.round(performance.memory.usedJSHeapSize / 1048576) : null;
  r.crossOriginIsolated = self.crossOriginIsolated;
  window.__result = r; log(JSON.stringify(r));
  return r;
};
window.__ready = true;
</script>
